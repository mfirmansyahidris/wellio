name: Publish Wellio Privacy Policy

on:
  push:
    branches: [main]
    paths:
      - 'docs/privacy-policy.html'
      - '.github/workflows/deploy-privacy-policy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the privacy policy site
        run: |
          mkdir -p site
          cp docs/privacy-policy.html site/privacy-policy.html
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=privacy-policy.html">
            <title>Wellio Privacy Policy</title>
          </head>
          <body>
            <p><a href="privacy-policy.html">Read the Wellio Privacy Policy</a></p>
          </body>
          </html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
